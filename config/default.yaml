project:
  name: enzyme-ph-generalization
  random_seed: 42

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  cleaned_dataset: data/processed/cleaned_dataset.csv
  handcrafted_features: data/processed/handcrafted_features.csv
  sequences_fasta: data/processed/clusters/sequences.fasta
  clusters_dir: data/processed/clusters
  embeddings_dir: data/processed/embeddings
  hf_cache_dir: data/processed/embeddings/hf_cache
  embedding_file: data/processed/embeddings/esm2_t6_8M_UR50D_embeddings.npy
  embedding_metadata: data/processed/embeddings/esm2_t6_8M_UR50D_metadata.json
  splits_dir: data/splits
  reports_dir: reports
  data_quality_report: reports/data_quality_report.md
  figures_dir: reports/figures
  tables_dir: reports/tables
  outputs_dir: outputs

dataset:
  file: pHopt_data.csv
  sequence_column: Sequence
  target_column: pHopt
  id_column: Accession
  organism_column: Organism
  taxonomy_column: taxonomy
  ec_column: EC Number
  split_column: Split
  required_columns:
    - Sequence
    - pHopt

validation:
  allowed_amino_acids: ACDEFGHIKLMNPQRSTVWY
  ambiguous_amino_acids: XBZJUO
  min_sequence_length: 30
  max_sequence_length: 5000
  min_ph: 0.0
  max_ph: 14.0
  drop_invalid_sequences: true
  drop_missing_targets: true
  drop_out_of_range_targets: true

splitting:
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  cluster_identity_thresholds:
    - 0.90
    - 0.70
    - 0.50

clustering:
  tool: auto
  mmseqs_binary: mmseqs
  cdhit_binary: cd-hit
  coverage: 0.80
  cov_mode: 0
  threads: 4

embeddings:
  model_name: facebook/esm2_t6_8M_UR50D
  batch_size: 8
  max_sequence_length: 1022
  device: auto

models:
  ridge:
    alpha: 1.0
  random_forest:
    n_estimators: 300
    max_depth: null
    n_jobs: -1
  histogram_gradient_boosting:
    max_iter: 300
    learning_rate: 0.05

evaluation:
  bootstrap_iterations: 500
  bootstrap_confidence_level: 0.95
  subgroup_min_count: 20
  subgroup_top_n: 25
